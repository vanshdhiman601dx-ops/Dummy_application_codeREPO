name: Trigger Automation

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Automation Repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: vanshdhiman601dx-ops/rexpt-automation-porject-vansh
          event-type: run-playwright
