<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rexpt Dummy Page</title>
    <style>
      :root {
        --purple: #6323ef;
        --purple-light: #7433ff;
        --ink: #151515;
        --muted: #77717d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 35% 20%, rgba(116, 137, 255, 0.15), transparent 10%),
          radial-gradient(circle at 55% 40%, rgba(94, 229, 255, 0.12), transparent 11%),
          radial-gradient(circle at 5% 44%, rgba(127, 255, 190, 0.11), transparent 11%),
          radial-gradient(circle at 7% 65%, rgba(255, 232, 153, 0.13), transparent 12%),
          #fff;
      }

      .page {
        position: relative;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 42px 20px 36px;
      }

      .content {
        width: min(100%, 535px);
        text-align: center;
      }

      .brand {
        margin: 0 0 32px;
        font-size: clamp(2.25rem, 5vw, 4.25rem);
        font-weight: 850;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .brand span {
        color: var(--purple);
      }

      .tagline {
        margin: 0 0 30px;
        font-size: clamp(2rem, 4.3vw, 3.15rem);
        font-weight: 750;
        line-height: 1.12;
        letter-spacing: -0.035em;
      }

      .tagline .accent {
        display: block;
        color: var(--purple);
      }

      .tagline .dark {
        display: block;
      }

      .features {
        width: fit-content;
        margin: 0 auto 12px;
        padding: 0;
        list-style: none;
        text-align: left;
      }

      .features li {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 18px 0;
        font-size: clamp(1.15rem, 2.1vw, 1.55rem);
        font-weight: 700;
      }

      .check {
        display: inline-grid;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: linear-gradient(145deg, var(--purple-light), var(--purple));
        font-size: 1.35rem;
        font-weight: 800;
      }

      .caption {
        margin: 8px 0 2px;
        color: var(--muted);
        font-size: 1.05rem;
        font-weight: 550;
      }

      .skip {
        display: inline-block;
        margin-bottom: 34px;
        color: var(--ink);
        font-size: 1.05rem;
        font-weight: 750;
        text-decoration: none;
      }

      .cta {
        display: flex;
        width: 100%;
        min-height: 76px;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border-radius: 20px;
        color: white;
        background: linear-gradient(100deg, #6424ee, #7624ee);
        box-shadow: 0 14px 30px rgba(99, 35, 239, 0.2);
        font-size: 1.1rem;
        font-weight: 650;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 34px rgba(99, 35, 239, 0.28);
      }

      .arrow {
        font-size: 1.7rem;
        font-weight: 300;
        line-height: 1;
      }

      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 35px;
      }

      .pager .active {
        display: grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border-radius: 50%;
        color: white;
        background: var(--purple);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .pager .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #aaa6ad;
      }

      .confetti {
        position: absolute;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        opacity: 0.9;
      }

      .pink {
        top: 3%;
        right: 6.5%;
        background: #ffd2e2;
      }

      .blue {
        top: 24%;
        right: 21%;
        background: #68d6f7;
      }

      .cyan {
        top: 41%;
        right: 13.5%;
        width: 6px;
        height: 6px;
        background: #68defc;
      }

      .yellow {
        top: 49%;
        left: 28.5%;
        background: #e8ec00;
      }

      .purple {
        top: 36%;
        left: 58.8%;
        width: 6px;
        height: 6px;
        background: #9b72fa;
      }

      @media (max-width: 620px) {
        .page {
          align-items: flex-start;
          padding-top: 55px;
        }

        .brand {
          margin-bottom: 28px;
        }

        .tagline {
          margin-bottom: 24px;
        }

        .features li {
          margin: 14px 0;
        }

        .check {
          width: 35px;
          height: 35px;
          flex-basis: 35px;
        }

        .cta {
          min-height: 64px;
          border-radius: 17px;
        }

        .yellow {
          left: 5%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <span class="confetti pink" aria-hidden="true"></span>
      <span class="confetti blue" aria-hidden="true"></span>
      <span class="confetti cyan" aria-hidden="true"></span>
      <span class="confetti yellow" aria-hidden="true"></span>
      <span class="confetti purple" aria-hidden="true"></span>

      <section class="content" aria-labelledby="page-title">
        <h1 class="brand" id="page-title">Rexpt <span>Dummy Page</span></h1>

        <h2 class="tagline">
          <span class="accent">Never Miss a Call</span>
          <span class="dark">Never Miss a Client</span>
        </h2>

        <ul class="features">
          <li><span class="check">✓</span><span>Answers Calls</span></li>
          <li><span class="check">✓</span><span>Books Appointments</span></li>
          <li><span class="check">✓</span><span>Captures Leads</span></li>
        </ul>

        <p class="caption">On its own, Automatically &amp; 24×7</p>
        <a class="skip" href="#how-it-works">Skip&nbsp; &gt;&gt;&gt;</a>

        <a class="cta" id="how-it-works" href="#">
          <span>How It Works</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <div class="pager" aria-label="Page 1 of 2">
          <span class="active">1</span>
          <span class="dot"></span>
        </div>
      </section>
    </main>
  </body>
</html>
